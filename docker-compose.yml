version: '3.8'

services:
  # 1. Cấu hình Database (PostgreSQL 18.4)
  db:
    image: postgres:18.4-alpine
    container_name: petproject_db
    restart: always
    environment:
      POSTGRES_USER: YourUserName
      POSTGRES_PASSWORD: YourPassWord
      POSTGRES_DB: pet_DB
    ports:
      - "5432:5432"
    volumes:
      # Lưu trữ dữ liệu DB ra ngoài để không bị mất khi tắt Docker
      - postgres_data:/var/lib/postgresql/data

  # 2. Cấu hình Backend (FastAPI)
  backend:
    build: 
      context: ./backend  # Trỏ vào thư mục backend chứa Dockerfile
    container_name: petproject_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db  # Chờ DB chạy lên thì Backend mới được chạy
    environment:
      # LƯU Ý QUAN TRỌNG: Thay 'localhost' thành 'db' (tên của service bên trên)
      - DATABASE_URL=postgresql://YourUserName:YourPassWord@db:5432/pet_DB
      - SECRET_KEY=My_Secret_Key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    command: sh -c "alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"

  # 3. Cấu hình Frontend (ReactJS)
  frontend:
    build: 
      context: ./frontend  # Trỏ vào thư mục frontend chứa Dockerfile
    container_name: petproject_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend # Chờ Backend chạy thì Frontend mới chạy

volumes:
  postgres_data: